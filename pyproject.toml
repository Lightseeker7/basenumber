[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.sdist]
include = ["/basenumber"]
[tool.hatch.build.targets.wheel]
packages = ["basenumber"]
[project]
name = "basenumber"
version = "0.0.3"
authors = [
  { name="light.seeker", email="light.the.seeker@gmail.com" },
]
description = "Package used for storing and performing arithmetic with integers of arbitrary base systems 2 and above."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "baseconvert"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/Lightseeker7/basenumber"