[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"
[project]
name = "basenumber"
version = "0.0.6"
authors = [
  { name="light.seeker", email="light.the.seeker@gmail.com" },
]
description = "Package used for storing and performing arithmetic with integers of arbitrary base systems 2 and above."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "baseconvert"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://pypi.org/project/basenumber/"
Repository = "https://github.com/Lightseeker7/basenumber"